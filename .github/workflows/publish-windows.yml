name: Publish Windows update
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish validated executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          exe=bundle/SausageMapleAssist.exe
          if [ ! -f "$exe" ]; then
            cat bundle/SausageMapleAssist.part-* > "$exe"
          fi
          sha256sum --check bundle/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "$exe" --verify-tag --title "Sausage MapleAssist $GITHUB_REF_NAME" --notes "Windows x64. Open this file from the existing app folder to use local settings."

